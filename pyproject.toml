[project]
name = "testhub-mcp"
version = "0.1.0"
description = "公共测试工具空间（Test Hub）—— 面向所有项目的远程测试工具 MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
testhub-mcp = "server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "core", "security"]
